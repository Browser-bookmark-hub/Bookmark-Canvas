<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Bookmark Canvas Panel</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1117;
      color-scheme: dark;
    }
    #canvasSidePanelFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0f1117;
      opacity: 0;
      transition: opacity 80ms ease-out;
    }
    html.frame-ready #canvasSidePanelFrame {
      opacity: 1;
    }
    html[data-theme="light"],
    html[data-theme="light"] body {
      background: #f8fafc;
      color-scheme: light;
    }
    html[data-theme="light"] #canvasSidePanelFrame {
      background: #f8fafc;
    }
  </style>
  <script src="panel-shell-theme-bootstrap.js"></script>
  <link rel="stylesheet" href="panel-shell.css">
</head>
<body>
  <iframe
    id="canvasSidePanelFrame"
    src="history_html/history.html?view=canvas&sidepanel=1"
    title="Bookmark Canvas Side Panel"
    loading="eager"
  ></iframe>
  <script src="panel-shell.js"></script>
</body>
</html>
